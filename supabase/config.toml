[functions.manage-workspace-member]
# Require a valid Supabase JWT at the gateway; handler also validates caller and workspace role.
verify_jwt = true

[functions.create-workspace]
# Require a valid Supabase JWT before account-scoped workspace creation.
verify_jwt = true

[functions.ai-content]
# AI generation is user-authenticated and additionally validates the JWT in the handler.
verify_jwt = true

[functions.sslcommerz-create-session]
# Customer checkout session creation requires a valid Supabase JWT.
verify_jwt = true

[functions.sslcommerz-ipn]
# SSLCOMMERZ sends a provider webhook without a Supabase JWT; handler validates every event against the provider API.
verify_jwt = false

[functions.busicare-create-order]
# Authenticated order creation; product prices are read from the server-side catalogue.
verify_jwt = true
