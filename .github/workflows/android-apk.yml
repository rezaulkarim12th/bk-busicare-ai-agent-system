name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
  push:
    branches:
      - feature/android-apk-ci-clean

permissions:
  contents: read

jobs:
  build-android:
    name: Build BK-BusiCare Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web application for Android assets
        run: npm run build -- --base ./

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BK-BusiCare-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
