name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
  push:
    branches:
      - main
      - feature/android-apk-ci-clean
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  build-android:
    name: Build BK-BusiCare Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web application for Android assets
        run: npm run build -- --base ./

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare BK-BusiCare brand assets
        run: |
          python3 -m pip install --quiet Pillow
          mkdir -p assets
          curl --fail --location --retry 3 'https://busicarecom.wordpress.com/wp-content/uploads/2026/11/bk-busicare-official-logo.png.jpg' -o /tmp/bk-busicare-logo.jpg
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('/tmp/bk-busicare-logo.jpg').convert('RGB')
          icon = Image.new('RGB', (1024, 1024), 'white')
          source.thumbnail((960, 960), Image.Resampling.LANCZOS)
          icon.paste(source, ((1024-source.width)//2, (1024-source.height)//2))
          icon.save('assets/icon.png', optimize=True)
          splash = Image.new('RGB', (2732, 2732), 'white')
          mark = source.copy()
          mark.thumbnail((1900, 1900), Image.Resampling.LANCZOS)
          splash.paste(mark, ((2732-mark.width)//2, (2732-mark.height)//2))
          splash.save('assets/splash.png', optimize=True)
          PY
          npm install --no-save --package-lock=false @capacitor/assets@latest
          npx capacitor-assets generate --android

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android SDK levels
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("variables.gradle")
          content = variables.read_text()
          expected = {
              "minSdkVersion": "26",
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
          }
          for key, value in expected.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+(\s*)$"
              content, count = re.subn(pattern, rf"\g<1>{value}\g<2>", content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} setting in variables.gradle; found {count}")
          variables.write_text(content)

          root_build = Path("build.gradle")
          root_content = root_build.read_text()
          root_content, count = re.subn(
              r"(com\.android\.tools\.build:gradle:)\d+\.\d+\.\d+",
              r"\g<1>8.9.1",
              root_content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely locate Android Gradle Plugin version in build.gradle")
          root_build.write_text(root_content)

          print("Configured minSdk=26, compileSdk=36, targetSdk=36, Android Gradle Plugin=8.9.1")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BK-BusiCare-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
