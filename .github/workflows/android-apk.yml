name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
  push:
    branches:
      - main
      - feature/android-apk-ci-clean
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  build-android:
    name: Build BK-BusiCare Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web application for Android assets
        run: npm run build -- --base ./

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android SDK levels
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("variables.gradle")
          content = variables.read_text()
          expected = {
              "minSdkVersion": "26",
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
          }
          for key, value in expected.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+(\s*)$"
              content, count = re.subn(pattern, rf"\g<1>{value}\g<2>", content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} setting in variables.gradle; found {count}")
          variables.write_text(content)

          root_build = Path("build.gradle")
          root_content = root_build.read_text()
          root_content, count = re.subn(
              r"(com\.android\.tools\.build:gradle:)\d+\.\d+\.\d+",
              r"\g<1>8.9.1",
              root_content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely locate Android Gradle Plugin version in build.gradle")
          root_build.write_text(root_content)

          print("Configured minSdk=26, compileSdk=36, targetSdk=36, Android Gradle Plugin=8.9.1")
          PY

      - name: Generate BK-BusiCare launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path("public/busicare-app-icon.svg")
          if not source.is_file():
              raise SystemExit("Missing public/busicare-app-icon.svg")
          res = Path("android/app/src/main/res")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  subprocess.run(
                      ["rsvg-convert", "-w", str(size), "-h", str(size), "-o", str(folder / name), str(source)],
                      check=True,
                  )

          foreground = res / "drawable-nodpi"
          foreground.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              ["rsvg-convert", "-w", "432", "-h", "432", "-o", str(foreground / "ic_launcher_foreground.png"), str(source)],
              check=True,
          )
          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          (anydpi / "ic_launcher.xml").write_text(adaptive)
          (anydpi / "ic_launcher_round.xml").write_text(adaptive)
          print("Using the Capacitor-generated ic_launcher_background color resource.")
          print("Generated BK-BusiCare launcher icons for all Android density buckets and adaptive launchers.")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BK-BusiCare-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
