name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
  push:
    branches:
      - main
      - feature/android-apk-ci-clean
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  build-android:
    name: Build BK-BusiCare Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web application for Android assets
        run: npm run build -- --base ./

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android SDK levels
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("variables.gradle")
          content = variables.read_text()
          expected = {
              "minSdkVersion": "26",
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
          }
          for key, value in expected.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+(\s*)$"
              content, count = re.subn(pattern, rf"\g<1>{value}\g<2>", content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} setting in variables.gradle; found {count}")
          variables.write_text(content)

          root_build = Path("build.gradle")
          root_content = root_build.read_text()
          root_content, count = re.subn(
              r"(com\.android\.tools\.build:gradle:)\d+\.\d+\.\d+",
              r"\g<1>8.9.1",
              root_content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely locate Android Gradle Plugin version in build.gradle")
          root_build.write_text(root_content)

          print("Configured minSdk=26, compileSdk=36, targetSdk=36, Android Gradle Plugin=8.9.1")
          PY

      - name: Apply official BK-BusiCare launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open('public/busicare-official-icon.jpg').convert('RGBA')
          root = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(source, (size,size), method=Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', optimize=True)
          # Remove generated adaptive-icon XML so Android uses the supplied official artwork PNGs.
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              path = root / 'mipmap-anydpi-v26' / name
              if path.exists(): path.unlink()
          strings = root / 'values' / 'strings.xml'
          if strings.exists():
              import re
              text = strings.read_text()
              text, count = re.subn(r'<string name="app_name">.*?</string>', '<string name="app_name">BK-BusiCare One</string>', text, count=1)
              if count: strings.write_text(text)
          print('Applied official BK-BusiCare logo to all Android launcher densities.')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BK-BusiCare-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
