name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
  push:
    branches:
      - main
      - feature/android-apk-ci-clean
      - redteam/ai-quota-refund-20261127
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  build-android:
    name: Build BK-BusiCare Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Build web application for Android assets
        env:
          VITE_SUPABASE_URL: https://pdcpntalufiiilmpevnn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_-96_0LXAtVAqXsNF48IXUA_M_j2x1B2
        run: npm run build -- --base ./

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate branded Android launcher and adaptive icons
        run: |
          mkdir -p assets
          cp public/busicare-app-icon.svg assets/logo.svg
          npx @capacitor/assets generate --android --iconBackgroundColor '#081a33' --iconBackgroundColorDark '#081a33' --splashBackgroundColor '#081a33' --splashBackgroundColorDark '#081a33'

      - name: Configure Android SDK levels
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("variables.gradle")
          content = variables.read_text()
          expected = {
              "minSdkVersion": "26",
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
          }
          for key, value in expected.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+(\s*)$"
              content, count = re.subn(pattern, rf"\g<1>{value}\g<2>", content)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} setting in variables.gradle; found {count}")
          variables.write_text(content)

          root_build = Path("build.gradle")
          root_content = root_build.read_text()
          root_content, count = re.subn(
              r"(com\.android\.tools\.build:gradle:)\d+\.\d+\.\d+",
              r"\g<1>8.9.1",
              root_content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not safely locate Android Gradle Plugin version in build.gradle")
          root_build.write_text(root_content)

          print("Configured minSdk=26, compileSdk=36, targetSdk=36, Android Gradle Plugin=8.9.1")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BK-BusiCare-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
