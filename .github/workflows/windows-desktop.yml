name: BK-BusiCare One Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'capacitor.config.json'
      - 'electron-main.cjs'
      - 'electron-preload.cjs'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Install Windows packaging tools
        run: npm install --no-save --package-lock=false electron electron-builder
      - name: Build portable web assets
        run: npm run build -- --base ./
      - name: Package Windows x64 portable application
        run: npx electron-builder --win portable --x64 --config electron-builder.yml
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BK-BusiCare-One-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
