name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check workspace member Edge Function
        run: deno check supabase/functions/manage-workspace-member/index.ts
      - name: Run migration safety checks
        run: npm test
      - name: Check application JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/auth-portal.js
      - name: Require Supabase configuration for production deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo 'Missing VITE_SUPABASE_URL repository secret' && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo 'Missing VITE_SUPABASE_ANON_KEY repository secret' && exit 1)
      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
