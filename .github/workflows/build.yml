name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all dependencies for known vulnerabilities
        run: npm audit --audit-level=low
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - name: Type-check every Supabase Edge Function
        run: |
          deno check --node-modules-dir=none supabase/functions/manage-workspace-member/index.ts
          deno check --node-modules-dir=none supabase/functions/ai-content/index.ts
          deno check --node-modules-dir=none supabase/functions/busicare-create-order/index.ts
          deno check --node-modules-dir=none supabase/functions/sslcommerz-create-session/index.ts
          deno check --node-modules-dir=none supabase/functions/sslcommerz-ipn/index.ts
      - name: Run migration safety checks
        run: npm test
      - name: Check application JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/auth-portal.js
      # Supabase publishable keys are designed for browser exposure; never put a secret/service-role key here.
      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: https://rmnoiwzkhjwmgxwkfdzb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_roW_rFCQjnHVp_4GdWdR0w_1JP_XmUw
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
