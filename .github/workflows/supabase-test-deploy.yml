name: Deploy Supabase test environment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm migration and Edge Function deployment to the disposable TEST Supabase project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    environment: supabase-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/multitenant-foundation

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_REF must be a valid 20-character Supabase project ref."
            exit 1
          fi

      - name: Preview pending database migrations
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_REF"

      - name: Apply reviewed database migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Deploy workspace member function
        run: supabase functions deploy manage-workspace-member --remote="$SUPABASE_PROJECT_REF" --yes
