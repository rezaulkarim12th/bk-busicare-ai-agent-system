name: Supabase local migration test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-database:
    name: Apply migrations and test RLS in disposable local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm install

      - name: Run application and migration static tests
        run: npm test

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/manage-workspace-member/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.2.0

      - name: Start isolated local Supabase stack
        id: start-supabase
        run: supabase start

      - name: Apply all migrations to the disposable local database
        run: supabase db reset --local

      - name: Run pgTAP RLS isolation tests
        run: supabase test db

      - name: Verify local Supabase services
        run: supabase status

      - name: Stop local Supabase stack
        if: always() && steps.start-supabase.outcome == 'success'
        run: supabase stop --no-backup
